
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Youssef Bassem — Software Developer</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --blue-light: #eff6ff;
            --blue-border: #dbeafe;

            --text: #15171a;
            --muted: #737983;

            --border: #e5e7eb;

            --background: #f5f7fa;
        }


        /* =========================================
           BODY
        ========================================== */

        html {
            min-height: 100%;
        }

        body {

            min-height: 100vh;
            min-height: 100dvh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% -15%,
                    #eaf2ff 0,
                    #f5f7fa 42%,
                    #f5f7fa 100%
                );

            color: var(--text);

            display: flex;
            justify-content: center;
            align-items: center;

            padding:
                max(18px, env(safe-area-inset-top))
                16px
                max(18px, env(safe-area-inset-bottom))
                16px;

            overflow-x: hidden;
        }


        /* =========================================
           PAGE
        ========================================== */

        .page {

            width: 100%;
            max-width: 450px;

            animation:
                appear .55s ease-out;
        }


        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================================
           CARD
        ========================================== */

        .card {

            position: relative;

            width: 100%;

            background:
                rgba(255, 255, 255, .97);

            border:
                1px solid var(--border);

            border-radius: 25px;

            overflow: hidden;

            box-shadow:
                0 25px 70px rgba(30, 55, 90, .09),
                0 3px 10px rgba(30, 55, 90, .035);
        }


        .card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #3b82f6,
                    #60a5fa
                );
        }


        /* =========================================
           PROFILE
        ========================================== */

        .profile {

            text-align: center;

            padding:
                42px
                25px
                30px;
        }


        .profile-image {

            display: block;

            width: 108px;
            height: 108px;

            object-fit: contain;

            margin:
                0 auto 20px;

            padding: 14px;

            border-radius: 27px;

            background: white;

            border:
                1px solid var(--blue-border);

            box-shadow:
                0 10px 30px rgba(37, 99, 235, .10);

            animation:
                float 5s ease-in-out infinite;
        }


        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }

        }


        .name {

            font-size: 31px;

            line-height: 1.15;

            font-weight: 750;

            letter-spacing: -.9px;

            color: var(--text);

            overflow-wrap: break-word;
        }


        .role {

            margin-top: 9px;

            color: var(--muted);

            font-size: 14px;

            line-height: 1.5;

            font-weight: 450;
        }


        .company {

            color: var(--blue);

            font-weight: 650;
        }


        /* =========================================
           DIVIDER
        ========================================== */

        .divider {

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--border),
                    transparent
                );

            margin:
                0 27px;
        }


        /* =========================================
           CONTACTS
        ========================================== */

        .contacts {

            padding:
                18px
                22px
                8px;
        }


        .contact {

            display: flex;

            align-items: center;

            width: 100%;

            min-height: 68px;

            padding:
                9px;

            border-radius: 15px;

            text-decoration: none;

            color: inherit;

            transition:
                background .2s ease,
                transform .2s ease;
        }


        .contact + .contact {

            margin-top: 2px;
        }


        .contact:hover {

            background:
                var(--blue-light);

            transform:
                translateX(3px);
        }


        .contact:active {

            transform:
                scale(.985);
        }


        /* =========================================
           CONTACT ICON
        ========================================== */

        .icon {

            width: 43px;
            height: 43px;

            flex:
                0 0 43px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                var(--blue-light);

            color:
                var(--blue);

            border:
                1px solid var(--blue-border);

            margin-right: 13px;
        }


        .icon svg {

            width: 18px;
            height: 18px;

            stroke:
                currentColor;
        }


        /* =========================================
           CONTACT TEXT
        ========================================== */

        .details {

            flex:
                1 1 auto;

            min-width: 0;

            overflow: hidden;
        }


        .label {

            display: block;

            color: #9298a2;

            font-size: 10px;

            font-weight: 550;

            margin-bottom: 3px;
        }


        .value {

            display: block;

            color: #25282d;

            font-size: 14px;

            line-height: 1.35;

            font-weight: 550;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .arrow {

            flex:
                0 0 auto;

            color:
                #b3bac4;

            font-size: 21px;

            margin-left: 7px;
        }


        /* =========================================
           BUTTONS
        ========================================== */

        .actions {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 10px;

            padding:
                14px
                22px
                22px;
        }


        .button {

            min-height: 49px;

            border-radius: 14px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            font-family: inherit;

            font-size: 13px;

            font-weight: 650;

            cursor: pointer;

            text-decoration: none;

            transition:
                transform .2s ease,
                background .2s ease,
                box-shadow .2s ease;
        }


        .button svg {

            width: 17px;
            height: 17px;
        }


        .save {

            border:
                1px solid var(--blue-border);

            background:
                white;

            color:
                var(--blue);

            box-shadow:
                0 2px 6px rgba(37, 99, 235, .04);
        }


        .save:hover {

            background:
                var(--blue-light);

            transform:
                translateY(-2px);

            box-shadow:
                0 7px 18px rgba(37, 99, 235, .09);
        }


        .website {

            border:
                1px solid var(--blue);

            background:
                var(--blue);

            color:
                white;

            box-shadow:
                0 7px 18px rgba(37, 99, 235, .17);
        }


        .website:hover {

            background:
                var(--blue-dark);

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 24px rgba(37, 99, 235, .22);
        }


        .button:active {

            transform:
                scale(.98);
        }


        /* =========================================
           FOOTER
        ========================================== */

        .footer {

            text-align: center;

            padding:
                0
                20px
                21px;

            color:
                #a2a8b1;

            font-size:
                10px;
        }


        .footer span {

            color:
                #6b7280;
        }


        /* =========================================
           TOAST
        ========================================== */

        .toast {

            position: fixed;

            left: 50%;

            bottom:
                max(20px, env(safe-area-inset-bottom));

            transform:
                translate(-50%, 20px);

            background:
                #17191c;

            color:
                white;

            padding:
                11px 18px;

            border-radius:
                10px;

            font-size:
                12px;

            font-weight:
                550;

            opacity:
                0;

            pointer-events:
                none;

            transition:
                opacity .25s ease,
                transform .25s ease;

            z-index:
                100;
        }


        .toast.show {

            opacity:
                1;

            transform:
                translate(-50%, 0);
        }


        /* =========================================
           PHONE
        ========================================== */

        @media (max-width: 600px) {

            body {

                align-items:
                    flex-start;

                padding:
                    12px
                    12px
                    20px;
            }


            .page {

                max-width:
                    100%;
            }


            .card {

                border-radius:
                    21px;

                box-shadow:
                    0 12px 35px rgba(30, 55, 90, .08);
            }


            .profile {

                padding:
                    32px
                    18px
                    25px;
            }


            .profile-image {

                width:
                    88px;

                height:
                    88px;

                padding:
                    12px;

                border-radius:
                    22px;

                margin-bottom:
                    17px;
            }


            .name {

                font-size:
                    clamp(25px, 8vw, 30px);

                letter-spacing:
                    -.6px;
            }


            .role {

                font-size:
                    13px;

                margin-top:
                    7px;

                padding:
                    0 10px;
            }


            .divider {

                margin:
                    0 18px;
            }


            .contacts {

                padding:
                    12px
                    12px
                    5px;
            }


            .contact {

                min-height:
                    64px;

                padding:
                    8px;

                border-radius:
                    13px;
            }


            .icon {

                width:
                    41px;

                height:
                    41px;

                flex-basis:
                    41px;

                margin-right:
                    11px;

                border-radius:
                    11px;
            }


            .icon svg {

                width:
                    17px;

                height:
                    17px;
            }


            .label {

                font-size:
                    9px;
            }


            .value {

                font-size:
                    13px;
            }


            .arrow {

                font-size:
                    19px;

                margin-left:
                    5px;
            }


            /*
                On phones the buttons become
                full width and much easier to tap.
            */

            .actions {

                display:
                    flex;

                flex-direction:
                    column;

                gap:
                    9px;

                padding:
                    13px
                    12px
                    18px;
            }


            .button {

                width:
                    100%;

                min-height:
                    48px;

                border-radius:
                    13px;
            }


            .footer {

                padding-bottom:
                    17px;
            }

        }


        /* =========================================
           VERY SMALL PHONES
        ========================================== */

        @media (max-width: 350px) {

            body {

                padding:
                    8px;
            }


            .card {

                border-radius:
                    18px;
            }


            .profile {

                padding:
                    27px
                    14px
                    22px;
            }


            .profile-image {

                width:
                    78px;

                height:
                    78px;

                padding:
                    10px;

                border-radius:
                    19px;
            }


            .name {

                font-size:
                    24px;
            }


            .role {

                font-size:
                    12px;
            }


            .contacts {

                padding-left:
                    8px;

                padding-right:
                    8px;
            }


            .contact {

                min-height:
                    61px;
            }


            .value {

                font-size:
                    12px;
            }


            .actions {

                padding-left:
                    8px;

                padding-right:
                    8px;
            }

        }

    </style>
</head>


<body>


<div class="page">

<!-- SAVE MESSAGE -->

<div
    id="toast"
    class="toast"
>
    Contact saved
</div>


<script>

function saveContact() {

    const vCard =
`BEGIN:VCARD
VERSION:3.0
FN:Youssef Bassem
N:Bassem;Youssef;;;
ORG:M2M Software Studio
TITLE:Software Developer
TEL;TYPE=CELL:01214964130
EMAIL;TYPE=WORK:youssefbassem407@gmail.com
URL:https://m2m4solutions.com/
END:VCARD`;


    const blob =
        new Blob(
            [vCard],
            {
                type:
                    "text/vcard;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        "Youssef-Bassem.vcf";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);


    URL.revokeObjectURL(url);


    /* Show confirmation */

    const toast =
        document.getElementById("toast");


    toast.classList.add("show");


    setTimeout(
        () => {
            toast.classList.remove("show");
        },
        2200
    );

}

</script>
